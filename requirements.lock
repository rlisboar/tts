# requirements.lock — retrato do ambiente VERIFICADO (macOS arm64, CPython 3.12.4).
#
# Gerado de .venv-mlx (o venv que roda a suíte e a síntese) em 2026-09-24,
# task #29, com: `./.venv-mlx/bin/python -m pip freeze` (pip 26.1.2).
#
# requirements.txt continua sendo a lista CURADA (com o porquê de cada pin); aqui
# estão também os transitivos, para um venv novo não resolver outra combinação
# por conta própria. Wheels são macosx_*_arm64 / cp312 — este lock não vale para
# Linux (os servidores RTX têm o deles).
#
# REPRODUZIR (bit-a-versão):
#   python3.12 -m venv .venv-locktest
#   ./.venv-locktest/bin/python -m pip install -r requirements.lock
#   ./.venv-locktest/bin/python -m pytest tests/ -q            # suíte
#   ./.venv-locktest/bin/python smoke_sintese.py               # síntese real
#
# RESOLVER o requirements.txt com o lock como teto (atualiza só o que pedir):
#   pip install -r requirements.txt -c requirements.lock
#
# ATUALIZAR (regra do repo: mlx-* e a família deles, mais transformers, só sobem
# COM SÍNTESE REAL — ver o comentário no requirements.txt):
#   1. crie o venv de teste acima (ou `.venv-locktest/bin/pip install -U <pacote>`)
#   2. ./.venv-locktest/bin/python smoke_sintese.py --stt    # áudio não mudo + texto
#   3. ./.venv-locktest/bin/python -m pytest tests/ -q
#   4. verde? copie o freeze novo por cima deste arquivo:
#        ./.venv-locktest/bin/python -m pip freeze > requirements.lock
#      e atualize o comentário do pacote em requirements.txt (versão + data + o
#      que foi verificado). Só então o pin de mlx-*/transformers muda.
#
# Pacotes com URL direta ficam como estão (precisam de rede na instalação).

