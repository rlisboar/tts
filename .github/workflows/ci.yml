# GATE do TTS-STUDIO no push/PR — o mesmo gate do hook, agora fora da máquina do
# autor (o hook local é burlável com `--no-verify` e não existe em máquina limpa).
#
# Ordens e porquês:
#   • `estatica` PRIMEIRO e sozinha: é o estágio que o hook roda antes de tudo e o
#     que pega o defeito mais barato (F401/F811). Roda em segundos e é ela que
#     precisa ficar vermelha em <2 min (#293).
#   • `testes` só começa com a estática verde (`needs:`): suíte vermelha por import
#     morto é desperdício de runner.
#   • A lista do `pyflakes` NÃO é copiada aqui: `tests/_pyflakes_gate.py` a deriva
#     do próprio `.githooks/pre-commit`, e `tests/test_hook_pyflakes.py` (no job
#     `testes`) tem a contraprova de que a derivação não virou no-op. Lista
#     duplicada em YAML envelhece em silêncio; derivada, não.
#   • Hermético de propósito: sem `secrets`, sem rede para fora além do PyPI, sem
#     modelo. O caminho com modelo (`worker_real`) continua fora, como no default
#     do `pytest` — o resumo do run avisa que ele não correu.
#
# Custo/limite medidos e o porquê de cada escolha estão na #293 e no README
# (Desenvolvimento). Repo é público, então runner hospedado é gratuito e sem teto
# de minutos — o limite real é TEMPO e AMBIENTE:
#   • `estatica` e `suites-sh` são hospedados (`ubuntu-latest`): python + shell,
#     curso puro, nenhum import do app;
#   • `testes` é self-hosted porque o hospedado foi medido e não aguenta (36
#     falhas em 642 passes, ambiente e não código). `torch` sai do índice CPU: no
#     Linux o wheel padrão é o CUDA (~2,4 GB) e aqui não há GPU. Rodar a bateria
#     fora do macOS já rendeu um defeito de portabilidade real: `_serial_mtime`
#     (`tests/serial.sh`) usava `stat -f || stat -c` e no GNU o `stat -f` não falha
#     (imprime stats de filesystem) — o fallback nunca rodava e nenhum lock órfão
#     era roubado; corrigido na #293 (é o que deixa `suites-sh` rodar no Linux).
name: gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  estatica:
    name: pyflakes (lista do hook)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # SEM `setup-python`: no macOS ele crava `/Users/runner` mesmo com
      # `RUNNER_TOOL_CACHE` no ambiente (medido). Venv por job em `$RUNNER_TEMP`
      # (fora de `~/Documents`, que o agente não lê por TCC, e descartável).
      - name: venv do CI
        run: |
          V="$RUNNER_TEMP/venv"
          /Library/Frameworks/Python.framework/Versions/3.12/bin/python3 -m venv "$V"
          echo "$V/bin" >> "$GITHUB_PATH"
          "$V/bin/python" -V
          "$V/bin/python" -m pip install --quiet --disable-pip-version-check \
            --index-url https://download.pytorch.org/whl/cpu torch
          "$V/bin/python" -m pip install --quiet --disable-pip-version-check \
            -r requirements.txt pytest-timeout pytest-rerunfailures
      - name: pytest
        # `--timeout`: um teste pendurado falha em 3 min em vez de comer o job.
        # Método DEFAULT (SIGALRM), não `--timeout-method=thread`: o `thread` só
        # reporta o stack e deixa a thread pendurada viva — medido aqui, o teste
        # reexecutado pelo `--reruns` travava junto com a thread velha e o run
        # ficava parado. `--reruns 1`: a suíte tem asserção por RELÓGIO (ex.:
        # cancel no meio de deltas) que já falhou 1x sob carga de 6 agentes nesta
        # máquina e passou 3/3 isolada — 1 retry absorve isso sem mascarar erro
        # determinístico.
        run: python -m pytest tests/ -q --timeout=180 --reruns 1 --reruns-delay 2

  suites-sh:
    name: suítes .sh sem navegador nem modelo
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: estatica
    steps:
      - uses: actions/checkout@v4
      # Um comando só: o runner das .sh sabe a CLASSIFICAÇÃO por estágio, roda em
      # paralelo (-j 3, 19-22 s), tem teto portátil (o `timeout` do coreutils não
      # existe no macOS) e falha UMA vez se faltar dependência — em vez de cada
      # job repetir a lista e o teto à mão. `instancia` exige app de pé e fica
      # fora do CI; `navegador` pode virar job próprio depois.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: dependências (a suíte importa o app)
        run: python -m pip install --quiet -r requirements.txt
      - name: suítes .sh do estágio rápido
        run: bash tests/run_sh.sh rapido
