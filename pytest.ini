# Config MÍNIMA do repo: só o que o gate precisa e não cabe no `conftest`.
#
# #224 — a suíte deixa CREDENCIAL em TMPDIR. O `conftest` COPIA o `settings.json`
# do dono para o basetemp (é o vetor ARQUIVO do #206: o caminho é isolado, o
# conteúdo atravessa) e o default daqui (`tmp_path_retention_policy = all`) retinha
# as últimas 3 sessões: cada rodada deixava uma cópia com o `chat_api_key` do dono
# em texto claro em `/private/tmp/pytest-of-<user>/pytest-N/` — sobrevivendo à
# suíte e à sessão do agente, num diretório que o macOS só limpa no reboot.
#
# `failed` = sessão VERDE não fica (ninguém vai inspecionar), VERMELHA fica para
# depuração. A OUTRA ponta (run vermelho, e filho com `--basetemp`, onde esta
# política nem se aplica) é o teardown de SESSÃO do `conftest` — as duas são
# cobradas por `tests/test_tmpdir_sem_credencial.py`.
#
# #385 — o gate NÃO pode pendurar. Um `feed`/ffmpeg/vad travado prendia a rodada
# sem limite e sem culpado; com `pytest-timeout` o teste pendurado falha e o nome
# dele sai no resumo. 90 s é ~11x o teste mais lento da suíte (medido: 7,7 s em
# `test_suite_nasce_neutra_com_ambiente_hostil`), então não há falso vermelho por
# lentidão normal. O CI passa `--timeout=180` por cima.
#
# #1047 — `signal`, NÃO `thread`: o estouro tem de alcançar o thread PRINCIPAL,
# que é onde ficam as esperas bloqueantes (teardown de fixture, `socketserver.
# shutdown()` em `threading.Event.wait()`). Com `thread` o teto não pegou o
# pendura do espelho HTTP do `test_baixa_modelos`: 45–60 min, 100 % de CPU, duas
# vezes. Nenhum teste instala `SIGALRM` próprio (`grep -r SIGALRM tests/` vazio),
# então o método não disputa com ninguém.
[pytest]
tmp_path_retention_policy = failed
timeout = 90
timeout_method = signal
# #783 — `slow` separa a cauda longa (varredura de /tmp, worktree inteiro, ecapa)
# do job rápido do CI: o rápido tem de fechar em minutos e o lento tem teto próprio.
markers =
    slow: teste de minutos (roda no job `testes-lentos`, fora do gate rápido)
