# Drop-in: qual GPU é qual. CUDA_DEVICE_ORDER=PCI_BUS_ID fixa a numeração pela
# ordem física da placa, e a lista do CUDA_VISIBLE_DEVICES é lida ao contrário do
# que parece: `1,0` faz cuda:0 ser a PRIMEIRA entrada (a 4090) e cuda:1 a segunda
# (a 4070) — é o que o `omni_server.py` espera (`DEV = "cuda:0"` = OmniVoice,
# `MT_DEV = "cuda:1"` = tradutor isolado).
#
# Sem este drop-in a numeração segue o default do driver e o tradutor pode cair na
# MESMA placa do TTS (OOM ao carregar o 14B ao lado do OmniVoice + Whisper).
[Service]
Environment=CUDA_VISIBLE_DEVICES=1,0
