# Rotação do log de produção do TTS-STUDIO (#344 — achado P1 da auditoria #286).
#
# Instalar (sudo; `/etc/newsyslog.d` é do root):
#   sudo cp remote/newsyslog.d/tts-studio.conf /etc/newsyslog.d/tts-studio.conf
#   sudo chmod 644 /etc/newsyslog.d/tts-studio.conf
#   sudo newsyslog -v -f /etc/newsyslog.d/tts-studio.conf   # confere e FORÇA uma rotação
#
# O app escreve em `/tmp/tts-studio.log` (stdout/stderr do agente `studio.tts.server`).
# Sem rotação o arquivo cresce sem teto; e `/tmp` some no reboot — por isso o probe
# (`remote/health_probe.sh`) grava o histórico dele em `~/Library/Logs`, que
# sobrevive. 1 MB × 3 rotações = teto prático do log do app.
#
# Campos: arquivo, dono:grupo, modo, gerações, tamanho(KB), quando, flags.
# `B` = log binário (marca o início do arquivo novo), `J` = bzip2 na geração.
# O modo 0600 vale já na rotação; o `health_probe.sh install` também corrige o
# arquivo corrente (ele nasce 0644 pelo redirect do launchd).
#
# ATENÇÃO: o caminho do HOME é literal (o newsyslog não expande `~`). Se o usuário
# do mini não for `lisboa`, ajuste as duas linhas dele.
/tmp/tts-studio.log                  lisboa:staff  600  3  1024  *  BJ
/Users/lisboa/Library/Logs/tts-health-probe.log  lisboa:staff  600  3  256  *  BJ
